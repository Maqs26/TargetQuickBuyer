    <g fill="#fff4d6"><ellipse cx="-15" cy="-28" rx="3" ry="1.7"/><ellipse cx="3" cy="-34" rx="3" ry="1.7"/><ellipse cx="18" cy="-26" rx="3" ry="1.7"/></g>
  </g>
  <path d="M100 -74 q30 2 34 -26 q-18 -2 -28 8 q-6 -20 -24 -18 q-6 26 18 36 z" fill="#e8392e"/>
