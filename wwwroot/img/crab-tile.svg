<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <g id="burger">
      <!-- bottom bun -->
      <rect x="-34" y="14" width="68" height="14" rx="7" fill="#e0a052"/>
      <!-- patty -->
      <rect x="-37" y="2" width="74" height="13" rx="6.5" fill="#6b3a1f"/>
      <!-- cheese -->
      <path d="M-36 0 H36 L28 8 L18 2 L6 10 L-6 2 L-18 9 L-28 2 Z" fill="#ffcf3a"/>
      <!-- lettuce -->
      <path d="M-38 -3 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0 q6 -6 12 0 v4 h-76 z" fill="#58c050"/>
      <!-- tomato -->
      <rect x="-33" y="-8" width="66" height="6" rx="3" fill="#e6463c"/>
      <!-- top bun -->
      <path d="M-36 -8 Q-36 -38 0 -38 Q36 -38 36 -8 Z" fill="#f0b45e"/>
      <g fill="#fff4d6">
        <ellipse cx="-14" cy="-26" rx="2.6" ry="1.5" transform="rotate(-20 -14 -26)"/>
        <ellipse cx="2" cy="-31" rx="2.6" ry="1.5"/>
        <ellipse cx="16" cy="-24" rx="2.6" ry="1.5" transform="rotate(25 16 -24)"/>
        <ellipse cx="-2" cy="-19" rx="2.6" ry="1.5" transform="rotate(10 -2 -19)"/>
        <ellipse cx="-24" cy="-15" rx="2.6" ry="1.5" transform="rotate(-35 -24 -15)"/>
      </g>
    </g>
    <g id="crab">
      <!-- legs -->
      <g stroke="#c4271f" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M-22 10 l-16 10 l-4 12"/><path d="M-18 16 l-10 14 l2 10"/>
        <path d="M22 10 l16 10 l4 12"/><path d="M18 16 l10 14 l-2 10"/>
      </g>
      <!-- arms + claws -->
      <g stroke="#c4271f" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M-26 0 q-14 -8 -20 -24"/><path d="M26 0 q14 -8 20 -24"/>
      </g>
      <path d="M-46 -24 q-14 -4 -12 -18 q10 2 14 8 q2 -10 10 -12 q4 12 -12 22 z" fill="#e8392e"/>
      <path d="M46 -24 q14 -4 12 -18 q-10 2 -14 8 q-2 -10 -10 -12 q-4 12 12 22 z" fill="#e8392e"/>
      <!-- eye stalks -->
      <g stroke="#c4271f" stroke-width="5" stroke-linecap="round"><path d="M-8 -14 v-20"/><path d="M8 -14 v-20"/></g>
      <!-- body -->
      <ellipse cx="0" cy="4" rx="30" ry="22" fill="#e8392e"/>
      <ellipse cx="-9" cy="-4" rx="9" ry="5" fill="#ff7a6b" opacity=".6"/>
      <!-- eyes -->
      <circle cx="-8" cy="-38" r="8" fill="#fff"/><circle cx="8" cy="-38" r="8" fill="#fff"/>
      <circle cx="-6" cy="-37" r="3.4" fill="#1b1b2f"/><circle cx="10" cy="-37" r="3.4" fill="#1b1b2f"/>
      <!-- grin -->
      <path d="M-12 10 q12 10 24 0" stroke="#7a1410" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <use xlink:href="#crab" href="#crab" transform="translate(75 85) rotate(-12)"/>
  <use xlink:href="#crab" href="#crab" transform="translate(260 100) rotate(10) scale(.8)"/>
  <use xlink:href="#crab" href="#crab" transform="translate(180 210) rotate(-4) scale(.6)"/>
  <use xlink:href="#crab" href="#crab" transform="translate(85 290) rotate(14) scale(.75)"/>
  <use xlink:href="#crab" href="#crab" transform="translate(290 300) rotate(-18) scale(.9)"/>
  <use xlink:href="#burger" href="#burger" transform="translate(215 30) rotate(8) scale(.45)"/>
</svg>
